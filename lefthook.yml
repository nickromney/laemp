pre-commit:
  commands:
    shellcheck:
      glob: "*.sh"
      run: scripts/hooks/check-staged-shell.sh --execute {staged_files}

pre-push:
  commands:
    local-ci:
      run: uv run --locked scripts/hooks/run-local-ci.sh --execute
    installer-contracts:
      run: uv run --locked make test
    gate-refusal-contract:
      run: bats tests/bats/local-gate-refusal.bats
